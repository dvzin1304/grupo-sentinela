<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Paciente</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 Cadastrar Paciente</h1>
    </div>

    <div class="card">

        <h2>Informações Pessoais</h2>

        <label>Nome Completo:</label>
        <input type="text" placeholder="Digite seu nome">

        <label>CPF:</label>
        <input type="text" placeholder="CPF completo">

        <label>Sexo:</label>
        <input type="text" placeholder="Informe seu sexo">

        <label>Data de Nascimento:</label>
        <input type="date">

        <label>Endereço:</label>
        <input type="text" placeholder="Endereço completo">

        <h3>Meios de Contato</h3>

        <label>Telefone:</label>
        <input type="text" placeholder="Telefone completo">

        <label>E-mail:</label>
        <input type="email" placeholder="Exemplo@email.com">

        <label>Convênio:</label>
        <input type="text" placeholder="Informe seu convênio">

        <label>Contato de Emergência:</label>
        <input type="text" placeholder="Número de emergência">

        <button>Finalizar</button>

    </div>

</div>

</body>
</html>
