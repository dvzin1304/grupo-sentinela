<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem Neurológica</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 Triagem Neurológica</h1>
    </div>

    <div class="card">

        <h2>Campos Obrigatórios</h2>

        <label>Estado Mental:</label>
        <input type="text">

        <label>Nervos Cranianos:</label>
        <input type="text">

        <label>Motricidade e Coordenação:</label>
        <input type="text">

        <label>Sensibilidade:</label>
        <input type="text">

        <label>Reflexos:</label>
        <input type="text">

        <label>Marcha e Equilíbrio:</label>
        <input type="text">

        <label>Sintomas Principais:</label>
        <textarea placeholder="Descreva os principais sintomas neurológicos."></textarea>

        <label>Classificação de Risco:</label>

        <select>
            <option>Selecione</option>
            <option>Baixo</option>
            <option>Moderado</option>
            <option>Alto</option>
            <option>Emergência</option>
        </select>

        <label>Temperatura:</label>
        <input type="text">

        <label>Saturação:</label>
        <input type="text" placeholder="Ex: 98%">

        <button>Enviar</button>

    </div>

</div>

</body>
</html>
