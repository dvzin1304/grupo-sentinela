<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Neurológico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Hospital Neurologia</h1>
        <p>Módulo: Atendimento Neurológico</p>
    </div>

    <div class="patient">

        <h2>Prontuário Neurológico do Paciente</h2>

        <div class="patient-grid">

            <p><strong>Nome:</strong> João da Silva</p>
            <p><strong>Sexo:</strong> Masculino</p>

            <p><strong>CPF:</strong> 000.000.000-00</p>
            <p><strong>Telefone:</strong> (61) 99999-9999</p>

            <p><strong>Data de Nascimento:</strong> 01/01/1990</p>
            <p><strong>Convênio:</strong> SUS</p>

        </div>

    </div>

    <div class="card">

        <h2>Registro de Atendimento Neurológico</h2>

        <label>CRM do Neurologista:</label>
        <input type="text" placeholder="Digite o CRM">

        <label>Queixa Principal:</label>
        <textarea placeholder="Ex: cefaleia, tontura, tremores, alterações de memória..."></textarea>

        <label>Tempo de Evolução:</label>
        <textarea placeholder="Há quanto tempo os sintomas começaram?"></textarea>

        <label>Sinais Vitais:</label>
        <textarea placeholder="Pressão arterial, frequência cardíaca, temperatura..."></textarea>

        <label>Nível de Consciência:</label>
        <textarea placeholder="Escala de Coma de Glasgow, se indicado."></textarea>

        <label>Histórico da Moléstia Atual (HDA):</label>
        <textarea placeholder="Cronologia dos sintomas neurológicos."></textarea>

        <label>Medicamentos em Uso:</label>
        <textarea placeholder="Medicamentos utilizados pelo paciente."></textarea>

        <label>Alergias:</label>
        <textarea placeholder="Alergias a medicamentos."></textarea>

        <label>Histórico Familiar Neurológico:</label>
        <textarea placeholder="Doenças neurológicas na família."></textarea>

        <label>Exames Neurológicos Anteriores:</label>
        <textarea placeholder="EEG, ressonância, tomografia etc."></textarea>

        <div class="buttons">
            <button>Salvar Atendimento</button>
            <button>Cancelar</button>
        </div>

    </div>

</div>

</body>
</html>
