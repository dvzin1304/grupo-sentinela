<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Neurologia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 Hospital Neurologia</h1>
        <p>Módulo: Atendimento Neurológico</p>
    </div>

    <div class="card">

        <h2>Login</h2>

        <label>Usuário:</label>
        <input type="text" placeholder="Digite seu Usuário">

        <label>Senha:</label>
        <input type="password" placeholder="Digite sua Senha">

        <p class="forgot">
            Esqueceu sua <a href="#">Senha?</a>
        </p>

        <button>Login</button>

        <p class="register-text">
            Não tem uma conta? Registre-se.
        </p>

        <div class="buttons">
            <a href="cadastro-paciente.html">Paciente</a>
            <a href="cadastro-funcionario.html">Profissional</a>
        </div>

    </div>

</div>

</body>
</html>
